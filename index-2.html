<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indovina la canzone</title>
<style>
:root{--bg:#f6f3ff;--card:#fff;--text:#1d1530;--muted:#6b6483;--accent:#6d28d9;--a:#2563eb;--b:#e11d48;--ok:#16a34a;--bad:#dc2626;--line:#ded8f0}
@media (prefers-color-scheme:dark){:root{--bg:#14101f;--card:#1f1a2e;--text:#f1ecff;--muted:#a79fc4;--accent:#8b5cf6;--a:#60a5fa;--b:#fb7185;--line:#352d4d}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 4px}
.sub,.hint{color:var(--muted);font-size:14px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
input,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
textarea{min-height:140px;font-size:14px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:14px;width:100%;color:#fff;background:var(--accent);margin-top:8px}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button.ok{background:var(--ok)}button.bad{background:var(--bad)}
button.ta{background:var(--a)}button.tb{background:var(--b)}
button:disabled{opacity:.4}
.row{display:flex;gap:10px}.row>*{flex:1}
.score{text-align:center;padding:12px}.score .n{font-size:40px;font-weight:800;line-height:1}
.score.a{border-top:5px solid var(--a)}.score.b{border-top:5px solid var(--b)}
.mid{text-align:center}
#icon{font-size:56px}
#art{width:150px;height:150px;border-radius:12px;margin:6px auto}
.title{font-size:19px;font-weight:700;min-height:26px;margin:6px 0}
.big{font-size:20px;text-align:center;font-weight:800}
.hide{display:none!important}
</style></head><body><main>

<section id="setup">
  <h1>🎵 Indovina la canzone</h1>
  <p class="sub">Due squadre, un’anteprima di 30 secondi a caso: chi la indovina vince il punto.</p>
  <div class="card">
    <div class="row">
      <div><label for="na">Squadra 1</label><input id="na" value="Squadra Blu" maxlength="20"></div>
      <div><label for="nb">Squadra 2</label><input id="nb" value="Squadra Rossa" maxlength="20"></div>
    </div>
    <label for="goal">Punti per vincere</label>
    <input id="goal" type="number" min="1" max="50" value="5" inputmode="numeric">
  </div>
  <div class="card">
    <label for="songs">Canzoni (una per riga: Titolo - Artista)</label>
    <textarea id="songs"></textarea>
    <button id="reset" class="ghost" type="button">Ricarica i brani famosi (anni 60–2026)</button>
  </div>
  <button id="start">Inizia la partita</button>
</section>

<section id="game" class="hide">
  <div class="row">
    <div class="card score a"><div id="ta"></div><div class="n" id="sa">0</div></div>
    <div class="card score b"><div id="tb"></div><div class="n" id="sb">0</div></div>
  </div>
  <div class="card mid">
    <div class="hint" id="count"></div>
    <div id="icon">❓</div>
    <img id="art" class="hide" alt="">
    <div class="title" id="title">Premi “Prossima canzone”</div>
    <audio id="au"></audio>
    <button id="next">Prossima canzone</button>
    <button id="play" class="ghost hide">🔁 Riascolta</button>
  </div>
  <div id="guess" class="hide">
    <p class="hint" style="text-align:center">Chi ha prenotato per primo?</p>
    <div class="row"><button id="ga" class="ta"></button><button id="gb" class="tb"></button></div>
    <button id="reveal" class="ghost">Nessuno la sa: rivela</button>
  </div>
  <div id="judge" class="hide">
    <p class="big" id="who"></p>
    <div class="row"><button id="right" class="ok">✓ Giusta (+1)</button><button id="wrong" class="bad">✗ Sbagliata</button></div>
  </div>
  <button id="quit" class="ghost" style="margin-top:16px">Torna alle impostazioni</button>
</section>

<section id="end" class="hide">
  <div class="card mid">
    <div id="icon2" style="font-size:56px">🏆</div>
    <h1 id="winner"></h1>
    <p class="sub" id="final"></p>
    <button id="again">Nuova partita</button>
  </div>
</section>
</main>

function saveCache(){try{localStorage.setItem('ic_prev',JSON.stringify(cache))}catch(e){}}
function load(){var t='';try{t=localStorage.getItem('ic_songs4')||''}catch(e){}$('songs').value=t||DEFAULTS.join('\n')}

function upd(){
  $('sa').textContent=S.scores[0];$('sb').textContent=S.scores[1];
  $('ta').textContent=S.names[0];$('tb').textContent=S.names[1];
  $('ga').textContent=S.names[0];$('gb').textContent=S.names[1];

}
function norm(x){return (x||'').toLowerCase().replace(/[^a-z0-9à-ú]+/g,' ').trim()}
function key(x){return norm(x).split(' ').sort(function(a,b){return b.length-a.length})[0]||''}
var jid=0;
function jsonp(url,cb){
  var n='icb'+(jid++),s=document.createElement('script'),done=false;
  function end(d){if(done)return;done=true;try{delete window[n]}catch(e){window[n]=undefined}s.remove();cb(d)}
  window[n]=end;
  s.onerror=function(){end(null)};
  setTimeout(function(){end(null)},8000);
  s.src=url+'&callback='+n;
  document.head.appendChild(s);
}
function find(name,cb){
  if(cache[name]){cb(cache[name]);return}
  var p=name.split(' - '),title=p[0],artist=p.slice(1).join(' - ');
  var term=(title+' '+artist).replace(/’/g,"'");
  jsonp('https://itunes.apple.com/search?media=music&entity=song&limit=10&country=IT&term='+encodeURIComponent(term),function(d){
    if(!d||!d.results){cb(null);return}
    var t0=key(title),a0=key(artist),best=null,bs=-1;
    d.results.forEach(function(r){
      if(!r.previewUrl)return;
      var sc=(t0&&norm(r.trackName).indexOf(t0)>=0?2:0)+(a0&&norm(r.artistName).indexOf(a0)>=0?2:0);
      if(sc>bs){bs=sc;best=r}
    });
    if(!best||bs<2){cb(null);return}
    var o={u:best.previewUrl,a:(best.artworkUrl100||'').replace('100x100','300x300')};
    cache[name]=o;saveCache();cb(o);
  });
}

  var a=$('au');a.src=S.info.u;a.currentTime=0;

function next(){

}

}
